name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies (PyGObject)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 gir1.2-notify-0.7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m venv --system-site-packages .venv
          .venv/bin/pip install -e '.[dev]'

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -q

      - name: Icon generator is reproducible
        run: |
          python3 scripts/gen_icons.py
          git diff --exit-code --stat -- src/agent_bar/assets || \
            (echo "icons out of date: run scripts/gen_icons.py" && exit 1)
