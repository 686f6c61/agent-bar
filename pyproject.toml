[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bar"
version = "0.2.1"
description = "Linux top-bar indicator for AI coding agents (Kimi Code, Claude Code, Codex): live tokens, 'needs you' alerts, multi-session, stats."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "686f6c61" }]
keywords = ["linux", "appindicator", "kimi", "claude", "codex", "ai-agents"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
# Runtime needs PyGObject + AyatanaAppIndicator3 from the distro
# (apt: python3-gi gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1).
# They are intentionally NOT pip dependencies.
dependencies = []

[project.urls]
Homepage = "https://agent-bar.686f6c61.dev"
Repository = "https://github.com/686f6c61/agent-bar"
Issues = "https://github.com/686f6c61/agent-bar/issues"

[project.scripts]
agent-bar = "agent_bar.__main__:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_bar = ["assets/*/*.svg"]
